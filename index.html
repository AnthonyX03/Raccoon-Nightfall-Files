.choice-card h2{margin:0 0 5px;font:800 20px monospace}.choice-card p{color:#9aa2a3;font-size:13px;line-height:1.5;margin:0}.role{color:#a94242;font:10px monospace;letter-spacing:.15em}
.difficulty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.diff{border:1px solid #30383c;background:#0e1214;border-radius:9px;padding:14px;text-align:left;cursor:pointer}.diff:hover,.diff.active{border-color:#9a3b3b;background:#181113}.diff b{display:block;font:800 13px monospace;margin-bottom:5px}.diff span{font-size:11px;color:#879092;line-height:1.4}

.game{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px}
.sidebar{display:flex;flex-direction:column;gap:8px}.panel{background:#0c1012;border:1px solid #252c2f;border-radius:var(--radius);box-shadow:var(--shadow)}
.side-panel{padding:10px 11px}.side-title{font:800 9px monospace;letter-spacing:.14em;color:#778083;margin-bottom:7px}

.content{min-width:0}.scene{min-height:620px;background:#0a0d0e;border:1px solid #262d30;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}

.scene-body{padding:20px;display:flex;flex-direction:column;flex:1}.scene-kicker{font:10px monospace;letter-spacing:.16em;color:#9d3a3a;margin-bottom:9px}.scene-title{font:800 24px/1.2 Georgia,serif;margin:0 0 14px}.narrative{font:15px/1.75 Georgia,serif;color:#d2d0c8;white-space:pre-line;max-width:850px}.narrative em{color:#bbb9ae}.choices{margin-top:auto;padding-top:22px;display:grid;gap:8px}.choice{background:#111719;border:1px solid #343c40;border-radius:8px;padding:12px;text-align:left;cursor:pointer;font:13px/1.45 Georgia,serif}.choice:hover{border-color:#747c7d;background:#171d1f}.choice .hint{display:block;color:#6e797b;font:9px monospace;margin-top:5px}.logline{font:10px monospace;color:#737c7f;margin-top:14px}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tab{background:#0d1113;border:1px solid #293034;border-radius:7px;padding:8px 10px;font:11px monospace;cursor:pointer}.tab.active{background:#191e20;border-color:#777f82}
.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:15px}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#0b0f10;border:1px solid #394144;border-radius:12px;box-shadow:0 30px 100px #000; padding:18px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modal h2{font:800 18px monospace;margin:0}.close{border:1px solid #333b3e;background:#111516;border-radius:6px;padding:6px 9px;cursor:pointer}.item-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.item{min-height:76px;background:#101516;border:1px solid #2b3336;border-radius:7px;padding:7px;cursor:pointer}.item:hover{border-color:#7b8283}.item .ico{font-size:22px}.item b{display:block;font:10px monospace}.item small{color:#717a7c;font-size:9px}.empty{color:#606a6d;text-align:center;padding:30px;font:12px monospace;border:1px dashed #293034;border-radius:8px}

.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.settings-card{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;background:#0e1214;border:1px solid #2a3235;border-radius:10px}
.settings-card .settings-icon{width:32px;height:32px;border-radius:8px;background:#151a1c;display:grid;place-items:center;font-size:14px}
.settings-card b{display:block;font:700 12px monospace}
.settings-card span{font:10px monospace;color:#6d7678}
.settings-card input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;background:#1a2022;outline:none;grid-column:1/-1;margin-top:4px}

.settings-card strong{font:700 12px monospace;color:#c39a52;min-width:36px;text-align:right}
.item.selected{outline:2px solid #c39a52;background:#1a1810}
.item .qty{position:absolute;right:4px;top:4px;font:800 10px monospace;color:#c39a52}
.item{position:relative}.item.empty-slot{opacity:.55;border-style:dashed;cursor:default}
.docs-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:11px 12px;background:linear-gradient(135deg,#111719,#0b0f10);border:1px solid #2d3639;border-radius:9px}.docs-toolbar .docs-count{font:10px monospace;color:#7f898b;letter-spacing:.08em}.docs-toolbar .docs-count b{color:#c39a52;font-size:13px}.docs-list{display:grid;gap:9px}.doc-card{position:relative;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:11px;padding:12px;background:linear-gradient(135deg,#111719,#0d1213);border:1px solid #2c3437;border-radius:9px;transition:.16s}.doc-card:hover{border-color:#596367;background:#141a1c;transform:translateY(-1px)}.doc-icon{width:42px;height:48px;display:grid;place-items:center;background:#171d1f;border:1px solid #394245;border-radius:7px;color:#c39a52;font-size:20px}.doc-card h3{font:800 12px monospace;margin:0 0 5px;color:#e1dfd7}.doc-card .doc-meta{font:9px monospace;color:#687173;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.doc-card .doc-type{display:inline-block;margin-left:6px;padding:2px 5px;border:1px solid #394245;border-radius:3px;color:#8c9698}.doc-card .doc-preview{margin:6px 0 0;color:#8d9697;font:11px/1.45 Georgia,serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.doc-read{min-width:62px}.doc-viewer{background:linear-gradient(135deg,#111719,#0b0f10);border:1px solid #343d40;border-radius:9px;padding:17px}.doc-viewer-head{display:flex;gap:11px;align-items:flex-start;padding-bottom:12px;margin-bottom:13px;border-bottom:1px solid #293134}.doc-viewer-icon{width:42px;height:48px;flex:0 0 42px;display:grid;place-items:center;background:#171d1f;border:1px solid #424b4d;border-radius:7px;color:#c39a52;font-size:20px}.doc-viewer h3{font:800 16px/1.25 Georgia,serif;margin:0 0 6px}.doc-viewer .meta{font:9px monospace;color:#687173}.doc-viewer-body{margin:0;color:#c3c2b9;font:13px/1.75 Georgia,serif;white-space:pre-line}.doc-footnote{margin-top:13px;padding-top:10px;border-top:1px dashed #2b3335;color:#687173;font:9px/1.5 monospace}.doc{padding:12px;background:#111617;border:1px solid #2c3437;border-radius:8px;margin-bottom:8px}.doc h3{font:800 13px monospace;margin:0 0 7px}.doc p{margin:0;color:#a8aeac;font:12px/1.55 Georgia,serif;white-space:pre-line}.doc .meta{font:9px monospace;color:#687173;margin-top:8px}
.inventory-note{font:10px monospace;color:#6d7678;margin-top:10px}.equip{display:grid;grid-template-columns:1fr 1fr;gap:7px}.equip button{text-align:left}

.combat{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.combat-card{padding:15px;background:#0e1314;border:1px solid #2b3336;border-radius:9px}.combat-portrait{height:160px;background:radial-gradient(circle at 50% 45%,#60686522,#070909 65%);display:grid;place-items:center;font:900 52px monospace;color:#7d8787;border:1px solid #252c2e;border-radius:7px;margin-bottom:12px}.threat{font:900 13px monospace}.threatbar{height:9px;background:#1d2426;border-radius:99px;overflow:hidden;margin:8px 0 12px}.threatbar i{display:block;height:100%;background:#a83232;transition:.2s}.aim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.aim{padding:11px 4px;background:#151a1c;border:1px solid #30383b;border-radius:7px;cursor:pointer;font:11px monospace}.aim:hover{border-color:#b64a4a}.combat-actions{display:grid;gap:7px}.combat-actions .btn{text-align:left}.combat-log{height:170px;overflow:auto;background:#080b0c;border:1px solid #22292c;border-radius:7px;padding:9px;font:10px/1.55 monospace;color:#879092;margin-top:10px}.combat-log div{margin-bottom:5px}.red{color:#d76560}.green{color:#82aa84}.amber{color:#c5a362}

function beep(freq=440,duration=.07,type="sine",volume=.06,bus="sfx"){
 if(PREFS.muted)return;
 const level=bus==="music"?(PREFS.music||0):(PREFS.sfx||0);
 if(level<=0)return;
 try{
  const ctx=getAudioCtx();if(!ctx)return;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,ctx.currentTime);
  const vol=Math.max(0.0001,(level/100)*volume);
  g.gain.setValueAtTime(vol,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+Math.max(0.03,duration));
  o.connect(g);g.connect(ctx.destination);
  o.start(ctx.currentTime);o.stop(ctx.currentTime+duration+0.03);
 }catch(e){}
}

const MUSIC_TRACKS = {
 intro: "Intro.mp3",
 adrian: "AdrianCole.mp3",
 mara: "MaraVela.mp3"
};
let __musicAudio = null;
let __musicTrack = null; // key: intro|adrian|mara
let __ambTimer = null;

function stopAmbient(){
 if(__ambTimer){clearTimeout(__ambTimer);__ambTimer=null}
}

function stopMusic(fade=false){
 if(!__musicAudio){ __musicTrack=null; return; }
 try{
  __musicAudio.pause();
  __musicAudio.currentTime=0;
 }catch(e){}
 __musicAudio=null; __musicTrack=null;
}
function applyMusicVolume(){
 if(!__musicAudio) return;
 const vol = (PREFS.muted || PREFS.music<=0) ? 0 : (PREFS.music/100)*0.85;
 try{
  __musicAudio.volume = Math.max(0, Math.min(1, vol));
  if(PREFS.muted || PREFS.music<=0){
   __musicAudio.pause();
  }
 }catch(e){}
}

function requestMusicPlayback(){
 const a=__musicAudio;
 if(!a || !__musicTrack || PREFS.muted || PREFS.music<=0 || !a.paused) return;
 if(a.__rnfPlayPending) return;
 a.__rnfPlayPending=true;
 try{
  const p=a.play();
  if(p && p.then){
   p.then(()=>{ a.__rnfPlayPending=false; window.__musicNeedsGesture=false; })
    .catch((err)=>{ a.__rnfPlayPending=false; if(err?.name==='NotAllowedError') window.__musicNeedsGesture=true; });
  }else{
   a.__rnfPlayPending=false;
  }
 }catch(e){ a.__rnfPlayPending=false; }
}
function playMusic(trackKey, {restart=false}={}){
 if(!MUSIC_TRACKS[trackKey]) return;
 // Same track already loaded: just ensure playing (no stop/start glitch)
 if(__musicTrack===trackKey && __musicAudio && !restart){
  applyMusicVolume();
  requestMusicPlayback();
  return;
 }
 const src = MUSIC_TRACKS[trackKey];
 // Soft switch: pause old, start new without double-restart loops
 if(__musicAudio){
  try{ __musicAudio.pause(); }catch(e){}
  __musicAudio=null;
 }
 __musicTrack = trackKey;
 try{
  const a = new Audio(src);
  a.loop = true;
  a.preload = "auto";
  a.setAttribute("playsinline","");
  a.playsInline = true;
  __musicAudio = a;
  applyMusicVolume();
  if(!PREFS.muted && PREFS.music>0) requestMusicPlayback();
  a.addEventListener("error",()=>{ console.warn("[RNF] No se pudo cargar:", src); });
 }catch(e){ __musicAudio=null; __musicTrack=null; }
}
function resumeMusicFromGesture(){
 window.__musicNeedsGesture=false;
 if(!__musicTrack){
  if(!S) playMusic("intro");
  else playMusic(S.char==="mara"?"mara":"adrian");
 }else{
  applyMusicVolume();
  requestMusicPlayback();
 }
}
function startAmbient(){ playMusic("intro"); }
function bindAudioUnlock(){
 const unlock=()=>{
  try{ getAudioCtx(); }catch(e){}
  resumeMusicFromGesture();
 };
 // Multiple events — iOS often needs a direct user gesture on Audio.play()
 ["pointerdown","touchstart","touchend","click","keydown"].forEach(ev=>{
  document.addEventListener(ev, unlock, {passive:true});
 });
}
function ensureAudio(){
 try{ getAudioCtx(); }catch(e){}
 resumeMusicFromGesture();
}

function setPref(key,val){
 if(key==="music"||key==="sfx")PREFS[key]=Math.max(0,Math.min(100,+val));
 else if(key==="muted")PREFS.muted=!!val;
 else if(key==="mode")PREFS.mode=val;
 savePrefs();applyMode();
 const el=document.querySelector(`[data-pref="${key}"]`);
 if(el&&(key==="music"||key==="sfx")){
  const lab=el.parentElement?.querySelector("strong");
  if(lab)lab.textContent=PREFS[key]+"%";
  if(key==="music") applyMusicVolume();
 }else{
  renderSettings();
 }
 if(key==="music"||key==="muted"){
  applyMusicVolume();
  if(!PREFS.muted && PREFS.music>0){
   if(!__musicTrack){ if(!S) playMusic("intro"); else playMusic(S.char==="mara"?"mara":"adrian"); }
   else requestMusicPlayback();
  }
 }
}

 if(!S)return;

function loadSaved(char,diff){
 try{const raw=localStorage.getItem(`rnf-save-${char}-${diff}`);return raw?JSON.parse(raw):null}catch(e){return null}
}
function toast(msg){
 const el=document.querySelector(".toast"); if(!el)return;
 el.textContent=msg;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1800)
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function clearSave(char,diff){
 try{localStorage.removeItem(`rnf-save-${char}-${diff}`)}catch(e){}
}
function startGame(char,diff,forceNew=false){
 if(forceNew){
  clearSave(char,diff);
  S=baseState(char,diff);
  S.scene=char==="adrian"?"introA":"introM";
 }else{
  const old=loadSaved(char,diff);
  S=old||baseState(char,diff);
  if(!old) S.scene=char==="adrian"?"introA":"introM";
 }
 S.startedAt=S.startedAt||Date.now();
 S.char=char;S.diff=diff;
 if(!S.visited)S.visited=[];
 if(!S.roomsVisited)S.roomsVisited=[S.room||"Calle Mercer"];
 if(!S.flags)S.flags={};
 if(S.flags.flashCharges===undefined && char==="mara") S.flags.flashCharges=3;
 if(!S.weapons){
  S.weapons = char==="adrian"
    ? {handgun:{level:1},shotgun:{level:0},smg:{level:0}}
    : {handgun:{level:0},shotgun:{level:0},smg:{level:0}};
 }
 if(S.weapons.handgun) S.weapons.handgun.level = S.weapons.handgun.level|| (char==="adrian"?1:0);
 if(!S.weapons.smg) S.weapons.smg = {level:0};
 // Migrate old saves: pull ammo ids into S.ammo counts
 if(!S.ammo) S.ammo={ammo9:0,shells:0,ammoSmg:0};
 for(const id of ["ammo9","shells","ammoSmg"]){
  const n=S.inventory.filter(x=>x===id).length;
  if(n){S.ammo[id]=(S.ammo[id]||0)+n;S.inventory=S.inventory.filter(x=>x!==id)}
 }
 // Cap stacks
 const CAPS={ammo9:60,shells:20,ammoSmg:200};
 for(const id of Object.keys(CAPS)) S.ammo[id]=Math.min(CAPS[id],S.ammo[id]||0);
 // Documents are archive records, never inventory/stash items. Migrate any legacy save safely.
 if(!Array.isArray(S.docs)) S.docs=[];
 const misplacedDocs=[...(S.inventory||[]),...(S.stash||[])].filter(id=>DOCS[id]);
 if(misplacedDocs.length){
  misplacedDocs.forEach(id=>{if(!S.docs.includes(id))S.docs.push(id)});
  S.inventory=(S.inventory||[]).filter(id=>!DOCS[id]);
  S.stash=(S.stash||[]).filter(id=>!DOCS[id]);
 }
  stripInkIfNeeded();
 recomputeInventoryMax();
 // Sync map for current scene
 const sc0=SCENES[S.scene]||CHAR_SCENES[S.char]?.[S.scene];
 if(sc0) syncMapFromScene(sc0);
 else if(!S.roomsVisited||!S.roomsVisited.length){S.room='Calle Mercer';S.map='barrio';S.roomsVisited=['Calle Mercer']}
 // Tema del personaje. No llamamos a ensureAudio() aquí: startGame() suele
 // ejecutarse dentro del click/tap que inicia la partida, y duplicar play()
 // en este punto provocaba el efecto de arrancar → parar → volver a arrancar.
 playMusic(char==="mara" ? "mara" : "adrian");
 renderGame();
}

function formatTime(sec){sec=Math.floor(sec||0);return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function inventoryCount(){return S.inventory.length}
function hasItem(id){return S.inventory.includes(id)}
function hasFlag(id){return !!S.flags[id]}
function ammoCount(id){return (S.ammo&&S.ammo[id])||0}
function addItem(ids){
 if(!Array.isArray(ids))ids=[ids];
 if(!S.ammo)S.ammo={ammo9:0,shells:0,ammoSmg:0};
 for(const id of ids){
  if(!ITEMS[id])continue;
  if(id==="ink" && DIFFS[S.diff].save!=="ink")continue;
  const it=ITEMS[id];
  if(it.type==="weapon"){ S.flags.equipped = S.flags.equipped||id; if(S.weapons[id]) S.weapons[id].level=Math.max(1,S.weapons[id].level||0); }
  if(it.type==="ammo"){
   const max=it.stack||60;
   const cur=ammoCount(id);
   if(cur>=max){toast(`${it.name}: al máximo (${max})`);continue}
   // If this ammo type is new, it needs a free slot
   if(cur===0 && slotCount()>=S.inventoryMax){toast("Inventario lleno");continue}
   S.ammo[id]=cur+1;
   toast(`+ ${it.name} (${S.ammo[id]}/${max})`);
  }else{
   if(slotCount()<S.inventoryMax){
    S.inventory.push(id);
    if(id==="pouch"){recomputeInventoryMax();toast(`+ ${it.name} · Inventario ampliado a ${S.inventoryMax}`)}
    else toast(`+ ${it.name}`);
   } else {S.stash.push(id);toast(`Baúl: ${it.name}`)}
  }
 }
}
function removeItem(id){
 if(ITEMS[id]?.type==="ammo"){
  if(!S.ammo||!S.ammo[id]||S.ammo[id]<=0)return false;
  S.ammo[id]--;return true;
 }
 const i=S.inventory.indexOf(id);if(i>=0){S.inventory.splice(i,1);if(id==="pouch")recomputeInventoryMax();return true}
 return false
}
function stripInkIfNeeded(){
 if(!S||DIFFS[S.diff].save==="ink")return;
 S.inventory=S.inventory.filter(x=>x!=="ink");
 S.stash=(S.stash||[]).filter(x=>x!=="ink");
 S.saves=99;
}
function addDoc(id){
 if(id && DOCS[id] && !S.docs.includes(id)){
  S.docs.push(id);
  toast(`Documento archivado: ${DOCS[id].title}`);
 }
}
function applyEffects(effects){
 if(!effects)return;
 const [type,val]=effects;
 if(type==="flag")S.flags[val[0]]=val[1];
}

 if(!a||!b||a===b) return false;

 const adj=[["mercer","orion"],["mercer","alley"],["orion","alley"],["alley","clinic"],["alley","tunnel"],["tunnel","station"],["tunnel","hospital"],["tunnel","water"],["hub","mercer"],["hub","orion"]];

}

function groupedInventory(arr){
 // Group stackable items for display: [{id, count, indices}]
 const groups=[], seen={};
 arr.forEach((id,i)=>{
  const it=ITEMS[id];
  if(it && (it.type==="ammo"||it.type==="heal"||it.type==="save") && it.stack>1){
   if(seen[id]===undefined){seen[id]=groups.length;groups.push({id,count:0,indices:[]})}
   groups[seen[id]].count++;groups[seen[id]].indices.push(i);

 });

function recomputeInventoryMax(){
 // Base 8 + 2 per pouch (max 2 pouches => 12)
 const p = Math.min(2, (S.inventory||[]).filter(id=>id==="pouch").length);
 S.inventoryMax = 8 + p*2;
}

function slotCount(){
 // slots used = non-ammo items + each ammo type with qty>0
 let n = (S.inventory||[]).length;
 if(S.ammo){ for(const k of Object.keys(S.ammo)) if(S.ammo[k]>0) n++; }
 return n;
}
function buildSlotList(){
 // Respect S.invOrder if present; otherwise default order
 recomputeInventoryMax();
 const inv = S.inventory||[];
 if(!S.invOrder) S.invOrder = [];
 // Build entries
 const entries = [];
 // From invOrder first
 const used = new Set();
 for(const entry of S.invOrder){
  if(entry.kind==="ammo"){
   if((S.ammo[entry.id]||0)>0){ entries.push({kind:"ammo",id:entry.id,qty:S.ammo[entry.id]}); used.add("ammo:"+entry.id); }
  } else if(entry.kind==="item" && inv.includes(entry.id)){
   // count occurrences
   const count = inv.filter(x=>x===entry.id).length;
   const already = entries.filter(e=>e.kind==="item"&&e.id===entry.id).length;
   if(already < count){ entries.push({kind:"item",id:entry.id}); used.add("item:"+entry.id+":"+already); }
  }
 }
 // Append missing inventory items
 const invCounts = {};
 for(const id of inv){ invCounts[id]=(invCounts[id]||0)+1; }
 const placed = {};
 for(const e of entries){ if(e.kind==="item") placed[e.id]=(placed[e.id]||0)+1; }
 for(const id of inv){
  placed[id]=placed[id]||0;
  if(placed[id] < invCounts[id]){ entries.push({kind:"item",id}); placed[id]++; }
 }
 // Append ammo not in order
 for(const id of ["ammo9","shells","ammoSmg"]){
  if((S.ammo[id]||0)>0 && !entries.some(e=>e.kind==="ammo"&&e.id===id))
   entries.push({kind:"ammo",id,qty:S.ammo[id]});
  else if((S.ammo[id]||0)>0){
   const e=entries.find(x=>x.kind==="ammo"&&x.id===id); if(e) e.qty=S.ammo[id];
  }
 }
 // Save order
 S.invOrder = entries.map(e=>({kind:e.kind,id:e.id}));
 return entries;
}

function storeAllFromInventory(){

 for(const id of items){
  if(!ITEMS[id] || ITEMS[id].type==="ammo") continue;

function takeAllFromStash(){
 if(!isCurrentSafe()){toast("Solo puedes usar el baúl en una zona segura");uiSound("error");return}
 let moved=0;
 // Do not call takeFromStash's UI refresh in a loop: move everything atomically.
 while((S.stash||[]).length && slotCount()<S.inventoryMax){
  const id=S.stash[0], it=ITEMS[id];
  if(!it){S.stash.shift();continue}
  if(it.type==="ammo"){
   const max=it.stack||60, cur=ammoCount(id);
   if(cur>=max || (cur===0 && slotCount()>=S.inventoryMax)){
    // Skip this ammo type and look for another storable item.
    const j=S.stash.findIndex(x=>x!==id && ITEMS[x] && ITEMS[x].type!=="ammo");
    if(j<0) break;
    S.stash.push(S.stash.splice(j,1)[0]);
    continue;
   }
   S.ammo[id]=cur+1; S.stash.shift(); moved++;
  }else{
   S.inventory.push(S.stash.shift());
   moved++;
   if(id==="pouch")recomputeInventoryMax();
  }
 }
 persist();
 document.querySelector(".modal-backdrop")?.remove();
 openInventory(true);
 toast(moved?`Sacados ${moved} objetos del baúl`:`No hay espacio o no se puede sacar más`);
}

window.moveInvSlot=(index,dir)=>{
 const slots=buildSlotList();
 const j=index+dir;
 if(j<0||j>=slots.length||index<0||index>=slots.length)return;
 const tmp=slots[index]; slots[index]=slots[j]; slots[j]=tmp;
 S.invOrder=slots.map(e=>({kind:e.kind,id:e.id}));
 // Also reorder S.inventory to match item order (ammo stays in S.ammo)
 const newInv=[];
 for(const e of slots){
  if(e.kind==="item") newInv.push(e.id);
 }
 // Preserve correct counts
 const counts={};
 for(const id of (S.inventory||[])) counts[id]=(counts[id]||0)+1;
 const final=[];
 const placed={};
 for(const id of newInv){
  placed[id]=placed[id]||0;
  if(placed[id]<(counts[id]||0)){ final.push(id); placed[id]++; }
 }
 for(const id of Object.keys(counts)){
  while((placed[id]||0)<counts[id]){ final.push(id); placed[id]=(placed[id]||0)+1; }
 }
 S.inventory=final;
 persist();
 document.querySelector(".modal-backdrop")?.remove();
 openInventory(false);
};
window.startCombineMode=()=>{
 _combineSel=null;
 const hint=document.getElementById("inv-hint");
 if(hint)hint.textContent="Modo combinar: elige el PRIMER objeto (planta)...";
 toast("Elige el primer objeto para combinar");
 window.__combineMode=true;
};
window.itemAction=(id,index,stash,action)=>{
 if(stash){
  if(slotCount()>=S.inventoryMax){toast("Inventario lleno");return}
  S.inventory.push(S.stash.splice(index,1)[0]);
  if(id==="pouch") recomputeInventoryMax();
  persist();document.querySelector(".modal-backdrop")?.remove();openInventory(true);return;
 }
 if(window.__combineMode){
  if(!_combineSel){
   _combineSel=id;
   const hint=document.getElementById("inv-hint");
   if(hint)hint.textContent=`Primer objeto: ${ITEMS[id]?.name}. Elige el SEGUNDO...`;
   toast(`Seleccionado: ${ITEMS[id]?.name}`);
   return;
  }
  const a=_combineSel,b=id;
  window.__combineMode=false;_combineSel=null;
  combine(a,b);
  document.querySelector(".modal-backdrop")?.remove();
  openInventory(false);
  return;
 }
 const it=ITEMS[id];
 if(!it)return;
 // Explicit action from buttons
 if(action==="equip" || (!action && it.type==="weapon")){
  if(it.type!=="weapon"){toast("Solo puedes equipar armas");return}
  if(!hasItem(id)){toast("No tienes ese arma");return}
  S.flags.equipped=id;
  uiSound("choice");
  toast("Equipada: "+it.name);
  persist();
  document.querySelector(".modal-backdrop")?.remove();
  renderGame();
  return;
 }
 if(action==="use" || (!action && (it.type==="heal"||it.type==="tool"||it.type==="expand"))){
  if(it.type==="heal"){ useItem(id); document.querySelector(".modal-backdrop")?.remove(); renderGame(); return; }
  if(it.type==="tool"&&id==="camera"){toast(`Flash restantes: ${S.flags.flashCharges||0}`);return}
  if(it.type==="expand"){toast(`Riñonera activa: inventario ${S.inventoryMax} huecos (${Math.min(2,(S.inventory||[]).filter(x=>x==="pouch").length)}/2)`);return}
 }
 if(it.type==="ammo"){toast(`${it.name}: se usa al disparar (${ammoCount(id)}/${it.stack})`);return}
 if(it.type==="save"){toast("Los cartuchos de tinta se usan en la máquina de escribir");return}
 if(it.type==="key"||it.type==="quest"){toast(`${it.name}: objeto de progreso. Se usa en la escena adecuada.`);return}
 toast(it.name);
};

function openMap(){
 const m=MAPS[S.map]||MAPS.barrio;
 const visited=new Set(S.roomsVisited||[]);
 // Ensure current room is marked visited
 if(S.room) visited.add(S.room);
 const shapes=(m.shapes||[]).map(sh=>{
  const isRoom=sh.type==="room";
  const isCur=isRoom && S.room===sh.id;
  const isVis=isRoom && (visited.has(sh.id)||isCur);
  const isSafe=isRoom && !!sh.safe;
  let fill="#050505", stroke="#1a1a1a";
  if(sh.type==="corridor"||sh.type==="stairs"){
   // show corridor if any connected room visited - simplify: show if any room visited
   const lit = visited.size>0;
   fill=lit?"#0a3d0a":"#080808";
   stroke=lit?"#1a7a1a":"#151515";
  }
  if(isRoom){
   if(isCur){fill="#1dbf1d";stroke="#9fff9f"}
   else if(isVis){fill="#0c5c0c";stroke="#2a9a2a"}
   else if(isSafe){fill="#0a2e1e";stroke="#2a7a5a"}
   else {fill="#0a0a0a";stroke="#222"}
  }
  if(sh.type==="stairs"){
   fill=visited.size?"#0a3d0a":"#080808";
   stroke=visited.size?"#1a7a1a":"#151515";
  }
  let el=`<rect x="${sh.x}" y="${sh.y}" width="${sh.w}" height="${sh.h}" fill="${fill}" stroke="${stroke}" stroke-width="${isCur?2.5:1.5}" rx="2"/>`;
  if(sh.type==="stairs"){
   for(let yy=sh.y+4;yy<sh.y+sh.h-2;yy+=5)
    el+=`<line x1="${sh.x+2}" y1="${yy}" x2="${sh.x+sh.w-2}" y2="${yy}" stroke="${stroke}" stroke-width="1"/>`;
  }
  if(isRoom){
   const lx=sh.x+sh.w/2, ly=sh.y+sh.h/2;
   if(isCur){
    el+=`<text x="${lx}" y="${ly-4}" text-anchor="middle" fill="#e8ffe8" font-family="monospace" font-size="9" font-weight="700">${sh.id}</text>`;
    el+=`<text x="${lx}" y="${ly+8}" text-anchor="middle" fill="#b6ffb6" font-family="monospace" font-size="7">◀ AQUÍ ▶</text>`;
    // player marker
    el+=`<circle cx="${lx}" cy="${sh.y+10}" r="4" fill="#fff" stroke="#1dbf1d" stroke-width="1.5"/>`;
   } else if(isVis){
    el+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#a8d8a8" font-family="monospace" font-size="8" font-weight="600">${sh.id}</text>`;
    if(isSafe) el+=`<text x="${lx}" y="${ly+10}" text-anchor="middle" fill="#6aba8a" font-family="monospace" font-size="6">SAFE</text>`;
   } else {
    el+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="#333" font-family="monospace" font-size="9">???</text>`;
   }
  }
  return el;
 }).join("");
 const htmlMap=`<div class="map"><svg viewBox="${m.viewBox||'0 0 400 320'}" preserveAspectRatio="xMidYMid meet">${shapes}</svg><div class="map-compass">N ↑</div></div>
 <div class="map-legend"><span><i class="l-cur"></i> Actual</span><span><i class="l-vis"></i> Explorado</span><span><i class="l-safe"></i> Zona segura</span><span><i class="l-unk"></i> Desconocido</span></div>
 <p class="inventory-note"><b>Ubicación actual:</b> ${esc(S.room||"?")} · Mapa: ${esc(m.title)} · Visitadas: ${(S.roomsVisited||[]).length}</p>`;
 openModal(`MAPA — ${m.title}`,htmlMap,"map-modal");
}

 crawler:{name:"Rastrero",hp:55,damage:15,behavior:"fast",weak:"legs",desc:"Se arrastra y ataca bajo. Difícil de mirar a los ojos."},
 stalker:{name:"Observador",hp:120,damage:22,behavior:"learn",weak:"arms",desc:"Estudia tus disparos. Cambiar de objetivo ayuda."},
 runner:{name:"Corredor",hp:60,damage:18,behavior:"fast",weak:"legs",desc:"Sprint infectado. Si no lo frenas, te envuelve."},
 bloater:{name:"Hinchado",hp:140,damage:25,behavior:"slow",weak:"legs",desc:"Inflado de gases tóxicos. Mejor no reventarlo de cerca."},
 armored:{name:"Acorazado",hp:130,damage:16,behavior:"slow",weak:"head",desc:"Aún lleva piezas de equipo. Hay que apuntar bien."},
 dog:{name:"Can infectado",hp:45,damage:20,behavior:"fast",weak:"legs",desc:"Bajo, rápido, brutal. Escucha mejor de lo que ves."},
 labcoat:{name:"Bata sucia",hp:95,damage:17,behavior:"learn",weak:"head",desc:"Expersonal de laboratorio. Conserva restos de táctica."},
 tyrant:{name:"Guardián V",hp:200,damage:28,behavior:"learn",weak:"head",desc:"Bioweapon imperfecto. No es un zombi: es un encargo."}
};
function startCombat(type,next){
 S.combat={type,next,enemy:clone(ENEMIES[type]),round:0,lastAim:null};
 S.stress=Math.min(100,S.stress+10);S.noise=0;renderGame();
}
function combatShot(aim){
 const c=S.combat,e=c.enemy;
 const weapon=S.flags.equipped|| (hasItem("handgun")?"handgun":hasItem("shotgun")?"shotgun":hasItem("smg")?"smg":null);
 if(!weapon || !hasItem(weapon)){toast("No tienes un arma equipada");return}
 const isShot=weapon==="shotgun";
 const isSmg=weapon==="smg";
 let ammoId=isShot?"shells":isSmg?"ammoSmg":"ammo9";
 if(isSmg && ammoCount(ammoId)<=0 && ammoCount("ammo9")>0) ammoId="ammo9";
 if(ammoCount(ammoId)<=0){toast("Sin munición");S.stress=Math.min(100,S.stress+9);combatEnemyTurn();return}
 removeItem(ammoId);uiSound("shot");
 const base=isShot?48:isSmg?32:24;
 const bonus=aim===e.weak?1.65:aim==="torso"?1:0.65;
 const stressPenalty=Math.max(.45,1-S.stress/220);
 const level = (S.weapons[weapon]?.level)||1;
 let dmg=Math.round(base*bonus*stressPenalty*(1+level*.12));
 if(e.behavior==="learn"&&c.lastAim===aim)dmg=Math.round(dmg*.7);
 e.hp-=dmg;c.lastAim=aim;c.round++;
 const noiseAdd=isShot?35:isSmg?22:18;
 S.noise=Math.min(100,S.noise+noiseAdd);S.stress=Math.min(100,S.stress+8);
 combatLog(`Disparas (${ITEMS[weapon].name}) a ${aim}. Daño ${dmg}. Ruido +${noiseAdd}.`,dmg>30?"green":"amber");
 if(e.hp<=0){toast(`${e.name} abatido`);setTimeout(()=>{S.combat=null;S.scene=c.next;persist();renderGame()},350);return}
 combatEnemyTurn();
}
function combatFlash(){
 const c=S.combat;
 if(!hasItem("camera")){toast("No tienes la cámara");return}
 if((S.flags.flashCharges||0)<=0){toast("Sin flash restante");uiSound("error");return}
 S.flags.flashCharges--;uiSound("flash");
 S.stress=Math.max(0,S.stress-8);
 S.noise=Math.max(0,S.noise-12);
 combatLog("¡Flash! La criatura se ciega por completo. Esquivas al 100%.","green");
 toast(`Flash usado · quedan ${S.flags.flashCharges}`);
 uiSound("save");
 // 100% dodge: no enemy turn
 renderGame();
}
function combatEnemyTurn(){
 const c=S.combat,e=c.enemy;
 let chance=e.behavior==="fast"?.72:e.behavior==="learn"?.58:.5;
 if(Math.random()>chance){combatLog("La criatura falla el ataque.", "green");renderGame();return}
 let dmg=Math.round(e.damage*DIFFS[S.diff].zombie*(S.stress>65?1.15:1));
 if(S.flags.usedEnvironment)dmg=Math.round(dmg*.75);
 S.hp-=dmg;S.stress=Math.min(100,S.stress+15);
 uiSound("hurt");combatLog(`${e.name} te alcanza. -${dmg} HP.`, "red");
 if(S.hp<=0){die();return}
 renderGame();
}
function combatDodge(){
 S.stress=Math.min(100,S.stress+5);
 S.noise=Math.max(0,S.noise-8);
 if(Math.random()<.65){uiSound("dodge");combatLog("Te apartas en el último instante.","green");renderGame()}
 else {combatLog("Calculas mal la distancia.","red");combatEnemyTurn()}
}
function combatBreathe(){S.stress=Math.max(0,S.stress-22);S.noise=Math.max(0,S.noise-5);combatLog("Respiras. El pulso baja.","green");combatEnemyTurn()}
function combatLog(msg,cls=""){if(!S.combat.log)S.combat.log=[];S.combat.log.push([msg,cls]);S.combat.log=S.combat.log.slice(-12)}
function die(){
 if(DIFFS[S.diff].perm){
  localStorage.removeItem(saveKey());S=null;
  renderShell(`<section class="screen"><div class="eyebrow">PROTOCOLO REALISTA</div><h1>SEÑAL PERDIDA</h1><p class="narrative">No hubo segundo intento. La noche continúa sin ti.</p><button class="btn primary" onclick="renderHome()">Volver al menú</button></section>`);
 }else{
  S.hp=100;S.stress=35;S.noise=0;S.combat=null;toast("Has sobrevivido por poco. Regresas al último punto estable.");persist();renderGame();
 }
}
function combatUI(){
 const c=S.combat,e=c.enemy;
 const ammo9=ammoCount("ammo9");
 const shells=ammoCount("shells");
 const ammoSmg=ammoCount("ammoSmg");
 const hasCam = hasItem("camera") && (S.flags.flashCharges||0)>0;
 const hasAnyWeapon = hasItem("handgun")||hasItem("shotgun")||hasItem("smg");
 return `<div class="combat">
 <div class="combat-card"><div class="combat-portrait">${esc(e.name.slice(0,2).toUpperCase())}</div>
 <div class="threat">${esc(e.name)}</div><div class="threatbar"><i style="width:${Math.max(0,e.hp/ENEMIES[c.type].hp*100)}%"></i></div>
 <p class="logline">${esc(e.desc)}</p><div class="combat-log">${(c.log||[]).map(x=>`<div class="${x[1]}">${esc(x[0])}</div>`).join("")||"<div>La criatura te ha localizado.</div>"}</div></div>
 <div class="combat-card"><div class="side-title">DECIDE BAJO PRESIÓN</div>
 ${hasAnyWeapon?`<div class="aim-grid"><button class="aim" onclick="combatShot('head')">CABEZA<br><small>alto daño / alto riesgo</small></button><button class="aim" onclick="combatShot('torso')">TORSO<br><small>estable</small></button><button class="aim" onclick="combatShot('legs')">PIERNAS<br><small>frena</small></button></div>`:`<p class="logline" style="color:var(--amber)">Sin arma de fuego. Usa flash o esquiva.</p>`}
 <div class="combat-actions" style="margin-top:8px">
  ${hasCam?`<button class="btn primary" onclick="combatFlash()">📷 Flash (100% esquiva) · ${S.flags.flashCharges}</button>`:""}
  <button class="btn" onclick="combatDodge()">↝ Esquivar / reposicionarte</button>
  <button class="btn" onclick="combatBreathe()">◌ Controlar respiración</button>
  ${S.hp<75?`<button class="btn" onclick="uiSound('choice');openInventory()">✚ Curarte</button>`:""}
  <button class="btn danger" onclick="openEscapeMenu()">↩ Buscar una salida</button>
 </div>
 <p class="logline">Munición: 9mm ${ammo9} · Escopeta ${shells} · SMG ${ammoSmg} · Estrés ${S.stress} · Ruido ${S.noise}${hasCam?` · Flash ${S.flags.flashCharges}`:""}</p></div></div>`;
}
function escapeChance(){
 if(!S.combat) return 0;
 const e=S.combat.enemy;
 let base=0.45;
 const beh=e.behavior||"slow";
 if(beh==="slow") base=0.55;
 else if(beh==="fast") base=0.32;
 else if(beh==="learn") base=0.28;
 // tyrant / high hp bosses harder
 if((e.hp||0)>150) base-=0.12;
 if(S.noise>60) base-=0.1;
 else if(S.noise<20) base+=0.08;
 if(S.stress>70) base-=0.08;
 else if(S.stress<30) base+=0.05;
 if(hasItem("camera")&&(S.flags.flashCharges||0)>0) base+=0.05;
 // wounded enemy easier to flee
 const maxHp=ENEMIES[S.combat.type]?.hp||100;
 if(e.hp<maxHp*0.4) base+=0.12;
 return Math.max(0.08, Math.min(0.85, base));
}
function openEscapeMenu(){
 if(!S.combat)return;
 const pct=Math.round(escapeChance()*100);
 const e=S.combat.enemy;
 const body=`<p class="narrative" style="margin-bottom:12px">Intentas romper la distancia con <b>${esc(e.name)}</b>.</p>
 <div class="stat"><span>Probabilidad de escape</span><b style="color:${pct>=50?"#8dcf8d":pct>=30?"#c39a52":"#c45"}">${pct}%</b></div>
 <div class="bar" style="margin:8px 0 14px"><i style="width:${pct}%;background:${pct>=50?"#3a8a3a":pct>=30?"#9c6f3c":"#8a3030"}"></i></div>
 <p class="inventory-note">Depende del tipo de enemigo, su herida, tu ruido y tu estrés. Fallar provoca un ataque inmediato.</p>
 <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
  <button class="btn primary" onclick="attemptEscape()">Correr ahora (${pct}%)</button>
  <button class="btn" onclick="attemptEscape(true)">Gastar flash y correr ${hasItem("camera")&&(S.flags.flashCharges||0)>0?"(+25%)":"(sin flash)"}</button>
  <button class="btn ghost" onclick="document.querySelector('.modal-backdrop')?.remove()">Seguir combatiendo</button>
 </div>`;
 openModal("ESCAPAR",body,"inv-modal");
}
function attemptEscape(useFlash=false){
 if(!S.combat)return;
 let chance=escapeChance();
 if(useFlash){
  if(!hasItem("camera")||(S.flags.flashCharges||0)<=0){toast("Sin flash");return}
  S.flags.flashCharges--;
  chance=Math.min(0.95, chance+0.25);
  uiSound("flash");
 }
 document.querySelector(".modal-backdrop")?.remove();
 const roll=Math.random();
 if(roll<chance){
  uiSound("dodge");
  toast("Escapas del enfrentamiento");
  const next=S.combat.next;
  S.combat=null;
  S.noise=Math.min(100,(S.noise||0)+10);
  S.stress=Math.min(100,(S.stress||0)+6);
  S.scene=next;
  const sc=SCENES[next]||CHAR_SCENES[S.char]?.[next];
  if(sc) syncMapFromScene(sc);
  persist();renderGame();
 }else{
  uiSound("hurt");
  toast("¡No logras escapar!");
  combatLog("Intentas huir, pero la criatura te corta el paso.","red");
  S.stress=Math.min(100,(S.stress||0)+10);
  combatEnemyTurn();
 }
}

function renderGame(){
 if(!S)return renderHome();
 let sc;
 if(S.scene==="__travel__") sc=getTravelScene();
 else if(S.scene==="__travel_arrive__"){ finishTravel(); return; }
 else sc=SCENES[S.scene]||CHAR_SCENES[S.char]?.[S.scene]||SCENES.intro;
 if(!S.combat && S.char==="adrian" && S.scene==="station_lobby" && S.visited.length>12 && !S.flags.midSeen){S.flags.midSeen=true; S.scene="a_mid"; sc=SCENES.a_mid;}
 if(!S.combat && S.char==="mara" && S.scene==="hospital_archive" && S.visited.length>12 && !S.flags.midSeen){S.flags.midSeen=true; S.scene="m_mid"; sc=SCENES.m_mid;}
 syncMapFromScene(sc);
 if(!S.visited.includes(S.scene)) S.visited.push(S.scene);
 const isSafeScene = !!(sc.safe || (sc.choices||[]).some(ch=>ch.safe) || ["safe_shop","safe_station","safe_hospital","safe_water"].includes(S.scene));
 const needsInk = DIFFS[S.diff].save === "ink";
 const inkCount = (S.saves||0) + S.inventory.filter(x=>x==="ink").length;
 const hp=Math.max(0,S.hp), stress=S.stress;
 const eqId = S.flags.equipped || (hasItem("handgun")?"handgun":hasItem("shotgun")?"shotgun":hasItem("smg")?"smg":null);
 if(eqId && !hasItem(eqId)) S.flags.equipped = hasItem("handgun")?"handgun":hasItem("shotgun")?"shotgun":hasItem("smg")?"smg":null;
 const eqNow = S.flags.equipped && hasItem(S.flags.equipped) ? S.flags.equipped : null;
 const eqLabel = eqNow ? `${ITEMS[eqNow].ico} ${ITEMS[eqNow].name}` : "Ninguna";
 const equipBtns = (()=>{
  const btns=[];
  btns.push(`<div class="equip-current">Equipada: <span>${esc(eqLabel)}</span></div>`);
  if(hasItem("handgun")) btns.push(`<button class="btn small ${eqNow==="handgun"?"primary":""}" onclick="S.flags.equipped='handgun';uiSound('choice');toast('Equipada: Pistola 9 mm');persist();renderGame()">🔫 Pistola${eqNow==="handgun"?" ✓":""}</button>`);
  if(hasItem("shotgun")) btns.push(`<button class="btn small ${eqNow==="shotgun"?"primary":""}" onclick="S.flags.equipped='shotgun';uiSound('choice');toast('Equipada: Escopeta');persist();renderGame()">💥 Escopeta${eqNow==="shotgun"?" ✓":""}</button>`);
  if(hasItem("smg")) btns.push(`<button class="btn small ${eqNow==="smg"?"primary":""}" onclick="S.flags.equipped='smg';uiSound('choice');toast('Equipada: SMG');persist();renderGame()">⚡ SMG${eqNow==="smg"?" ✓":""}</button>`);
  if(hasItem("camera")) btns.push(`<button class="btn small" onclick="uiSound('choice');toast('Flash restantes: '+(S.flags.flashCharges||0))">📷 Cámara (${S.flags.flashCharges||0})</button>`);
  if(!hasItem("handgun")&&!hasItem("shotgun")&&!hasItem("smg")&&!hasItem("camera")) btns.push(`<span class="logline">Sin equipo</span>`);
  return btns.join("");
 })();
 const content=`<div class="game screen">
 <aside class="sidebar">
  <div class="panel side-panel panel-status"><div class="side-title">ESTADO</div><div class="stat"><span>HP</span><b>${hp}/${S.maxHp}</b></div><div class="bar"><i style="width:${hp}%"></i></div><div class="stat"><span>Estrés</span><b>${stress}</b></div><div class="bar"><i style="width:${stress}%;background:#9c6f3c"></i></div><div class="stat"><span>Ruido</span><b>${S.noise}</b></div><div class="bar"><i style="width:${S.noise}%;background:#6c7071"></i></div></div>
  <div class="panel side-panel panel-resources"><div class="side-title">RECURSOS</div><div class="stat"><span>Espacios</span><b>${(typeof slotCount==="function"?slotCount():S.inventory.length)}/${S.inventoryMax}</b></div><div class="stat"><span>Baúl</span><b>${S.stash.length}</b></div>${needsInk?`<div class="stat"><span>Tinta</span><b>${inkCount}</b></div>`:""}<div class="stat"><span>Documentos</span><b>${S.docs.length}</b></div></div>
  <div class="panel side-panel nav-buttons"><button class="btn" onclick="uiSound('choice');openInventory()">▣ Inventario</button><button class="btn" onclick="uiSound('choice');openMap()">⌗ Mapa</button><button class="btn" onclick="uiSound('choice');openMissions()">⚑ Misiones</button><button class="btn" onclick="uiSound('choice');openDocs()">▤ Docs</button><button class="btn ${isSafeScene?"":"ghost"}" onclick="uiSound('choice');${isSafeScene?"openSafe()":"toast(&quot;Solo en zonas seguras (máquina de escribir)&quot;)"}">${isSafeScene?"✎ Zona segura":"✎ Guardar"}</button><button class="btn" onclick="uiSound('choice');openSettings()">⚙ Ajustes</button></div>
  <div class="panel side-panel panel-equip"><div class="side-title">EQUIPO</div><div class="equip">${equipBtns}</div></div>
 </aside>
 <section class="content"><div class="scene">
  <div class="mobile-status-bar">
   <div class="ms">HP<b>${hp}/${S.maxHp}</b><div class="bar"><i style="width:${Math.max(0,hp/S.maxHp*100)}%"></i></div></div>
   <div class="ms">Estrés<b>${stress}</b><div class="bar"><i style="width:${stress}%;background:#9c6f3c"></i></div></div>
   <div class="ms">Ruido<b>${S.noise}</b><div class="bar"><i style="width:${S.noise}%;background:#6c7071"></i></div></div>
  </div>
  <div class="scene-art"><div class="location">${esc(sc.loc)}</div><div class="time">${esc(sc.time)}</div></div>
  <div class="scene-body">
   ${S.combat?`<div class="scene-kicker">ENCUENTRO · PULSO</div><h1 class="scene-title">La amenaza está encima de ti</h1>${combatUI()}`:
   `<div class="scene-kicker">${S.ending?"EPÍLOGO":(S.visited.length<10?"CAPÍTULO I":S.visited.length<25?"CAPÍTULO II":"CAPÍTULO III")+" · INCIDENTE // "+String(S.visited.length).padStart(2,"0")}</div><h1 class="scene-title">${esc(sc.title)}</h1><div class="narrative">${esc(sc.text)}</div>
   ${sc.ending?`<div class="warning">FINAL ALCANZADO · ${S.docs.length} DOCUMENTOS · ${S.visited.length} ESCENAS DESCUBIERTAS</div>`:
   `<div class="choices">${(sc.choices||[]).map((c,i)=>{
    const locked = (c.requires && !hasItem(c.requires)) || (c.requires2 && !hasItem(c.requires2)) || (c.requiresFlag && !hasFlag(c.requiresFlag));
    const lockMsg = locked ? (c.requires && !hasItem(c.requires) ? " · Requiere "+(ITEMS[c.requires]?.name||c.requires) : c.requiresFlag && !hasFlag(c.requiresFlag) ? " · Bloqueado" : " · Bloqueado") : "";
    return `<button class="choice ${locked?"locked":""}" ${locked?"disabled":""} onclick='processChoice(${JSON.stringify(c).replace(/'/g,"&#39;")})'><b>${i+1}. ${esc(c.t)}</b>${c.hint?`<span class="hint">${esc(c.hint)}</span>`:""}${locked?`<span class="hint">${esc(lockMsg)}</span>`:""}</button>`;
   }).join("")}</div>`}
   <div class="logline">[${CAMPAIGN[S.char].name}] · ${DIFFS[S.diff].name} · ${formatTime(S.playTime)}</div>
   <div class="mobile-resources">
    <div class="ms">Espacios<b>${(typeof slotCount==="function"?slotCount():S.inventory.length)}/${S.inventoryMax}</b></div>
    <div class="ms">Baúl<b>${S.stash.length}</b></div>
    <div class="ms">Docs<b>${S.docs.length}</b></div>
   </div>`}
  </div>
 </div></section></div>`;
 renderShell(content);
 if(!timer)timer=setInterval(()=>{if(S&&!S.combat){S.playTime++;persist()}},1000);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S){openInventory()}});
window.showCharacters=showCharacters;window.showDifficulty=showDifficulty;window.startGame=startGame;window.restartCurrentGame=restartCurrentGame;window.wipeAllSaves=wipeAllSaves;window.showContinue=showContinue;window.showHow=showHow;window.renderHome=renderHome;
window.openSettings=openSettings;window.renderSettings=renderSettings;window.setPref=setPref;window.processChoice=processChoice;window.openInventory=openInventory;window.openDocs=openDocs;window.openDocument=openDocument;window.openMap=openMap;window.openMissions=openMissions;window.openSafe=openSafe;window.saveAtType=saveAtType;window.combatShot=combatShot;window.combatDodge=combatDodge;window.combatBreathe=combatBreathe;window.combatFlash=combatFlash;window.openEscapeMenu=openEscapeMenu;window.attemptEscape=attemptEscape;window.uiSound=uiSound;window.toast=toast;window.moveInvSlot=window.moveInvSlot;window.equipItem=window.equipItem;window.useInvItem=window.useInvItem;window.playMusic=playMusic;window.stopMusic=stopMusic;window.resumeMusicFromGesture=resumeMusicFromGesture;window.ensureAudio=ensureAudio;window.getAudioCtx=getAudioCtx;window.itemAction=window.itemAction;window.startCombineMode=window.startCombineMode;window.storeFromInventory=storeFromInventory;window.takeFromStash=takeFromStash;window.takeAllFromStash=takeAllFromStash;
applyMode();bindAudioUnlock();window.addEventListener("resize",()=>{if(PREFS.mode==="auto")applyMode()});setTimeout(()=>renderHome(),1500);

// ---- PWA install ----
let deferredPrompt=null;
function isStandalone(){
 return window.matchMedia("(display-mode: standalone)").matches
  || window.navigator.standalone === true;
}
function showInstallButton(){
 const b=document.getElementById("pwa-install");
 if(!b) return;
 if(isStandalone()){ b.style.display="none"; return; }
 b.style.display="inline-flex";
}
window.addEventListener("beforeinstallprompt", (e)=>{
 e.preventDefault();
 deferredPrompt=e;
 showInstallButton();
});
window.addEventListener("appinstalled",()=>{
 deferredPrompt=null;
 const b=document.getElementById("pwa-install");
 if(b) b.style.display="none";
 toast("App instalada");
});
function openInstallHelp(){
 const isiOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
 const isAndroid=/android/i.test(navigator.userAgent);
 let steps;
 if(isiOS){
  steps=`<p class="narrative"><b>iPhone / iPad (Safari)</b></p>
  <ol style="color:#c8cdc9;font:13px/1.5 sans-serif;padding-left:20px">
   <li>Toca el botón <b>Compartir</b> (cuadrado con flecha).</li>
   <li>Elige <b>Añadir a pantalla de inicio</b>.</li>
   <li>Confirma <b>Añadir</b>.</li>
  </ol>
  <p class="logline">En iOS no aparece el prompt automático; se instala desde Compartir.</p>`;
 }else if(isAndroid){
  steps=`<p class="narrative"><b>Android (Chrome)</b></p>
  <ol style="color:#c8cdc9;font:13px/1.5 sans-serif;padding-left:20px">
   <li>Menú ⋮ → <b>Instalar aplicación</b> o <b>Añadir a pantalla de inicio</b>.</li>
   <li>O pulsa el botón de instalar si aparece en la barra.</li>
  </ol>
  <p class="logline">Necesitas HTTPS (GitHub Pages, Netlify, etc.).</p>`;
 }else{
  steps=`<p class="narrative"><b>Escritorio (Chrome / Edge)</b></p>
  <ol style="color:#c8cdc9;font:13px/1.5 sans-serif;padding-left:20px">
   <li>Icono <b>⊕ Instalar</b> en la barra de direcciones.</li>
   <li>O menú ⋮ → <b>Instalar Raccoon Nightfall Files</b>.</li>
  </ol>
  <p class="logline">Sirve la carpeta por HTTPS o localhost. Abre <b>index.html</b> desde un servidor, no como archivo local (file://).</p>`;
 }
 openModal("INSTALAR APP", steps + `<div style="margin-top:12px"><button class="btn primary" style="width:100%" onclick="document.querySelector('.modal-backdrop')?.remove()">Entendido</button></div>`, "settings-modal");
}
async function installPWA(){
 if(isStandalone()){ toast("Ya está instalada"); return; }
 if(deferredPrompt){
  deferredPrompt.prompt();
  try{ await deferredPrompt.userChoice; }catch(e){}
  deferredPrompt=null;
  showInstallButton();
  return;
 }
 openInstallHelp();
}
window.installPWA=installPWA;
window.openInstallHelp=openInstallHelp;

// Register service worker early and robustly
if("serviceWorker" in navigator){
 const reg=()=>navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(()=>showInstallButton()).catch(err=>console.warn("[SW]",err));
 if(document.readyState==="complete") reg();
 else window.addEventListener("load", reg);
}
// Show install button on home even without beforeinstallprompt (help modal)
document.addEventListener("DOMContentLoaded", ()=>setTimeout(showInstallButton, 500));
})();
